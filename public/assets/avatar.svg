<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3d5be"/>
      <stop offset="100%" stop-color="#d8ab8c"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d34"/>
      <stop offset="100%" stop-color="#1a1a1f"/>
    </linearGradient>
  </defs>
  
  <!-- Transparent background - no rect! -->

  <!-- Torso silhouette (flat bottom) -->
  <path d="M40,320 C40,230 90,200 160,200 C230,200 280,230 280,320 Z" fill="url(#shirtGrad)"/>
  
  <!-- Neck -->
  <path d="M140,150 L180,150 L180,210 L140,210 Z" fill="#d8ab8c"/>
  
  <!-- Head -->
  <circle cx="160" cy="120" r="54" fill="url(#skinGrad)"/>
  
  <!-- Hair silhouette -->
  <path d="M102,128 C96,80 120,50 160,50 C200,50 224,80 218,128 C210,105 198,85 160,85 C122,85 110,105 102,128 Z" fill="#111113"/>
  
  <!-- Minimalist camera/lens badge accent on shirt -->
  <circle cx="215" cy="245" r="22" fill="#e50914" opacity="0.9"/>
  <circle cx="215" cy="245" r="16" fill="#111113"/>
  <circle cx="215" cy="245" r="8" fill="#ffffff" opacity="0.4"/>
</svg>
